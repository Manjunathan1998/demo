name: Pylint Check & Auto-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write  # ✅ Needed for git push to work

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install tools
        run: |
          pip install pylint autopep8 black isort

      - name: Run Pylint
        id: lint
        run: |
          SCORE=$(pylint main.py | grep 'Your code has been rated' | awk '{print $7}' | cut -d'/' -f1)
          echo "Pylint score: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Auto-fix if score < 8.5
        if: ${{ steps.lint.outputs.score < 8.5 }}
        run: python format_agent.py

      - name: Commit changes
        if: ${{ steps.lint.outputs.score < 8.5 }}
        run: |
          git config user.name "Manjunathan1998"
          git config user.email "manjunathsg407@gmail.com"
          git pull --rebase origin ${{ github.head_ref }}
          # Commit formatting changes first
          git add main.py
          git commit -m "🤖 Auto-format by Pylint fixer bot" || echo "No changes to commit"
          # Push the updated commit back to the PR
          git push origin HEAD:${{ github.head_ref }} || echo "⚠️ Push failed"