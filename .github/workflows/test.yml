name: Test Case and PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    strategy:
      matrix:
        python-version: [3.14.0-beta.4]

    env:
      MODE: "dev"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint 
          pip install openai==1.3.8

      - name: Run Pylint and save result
        id: lint
        run: |
          SCORE=$(pylint ./main.py --score y | grep 'Your code has been rated' | awk '{print $7}' | cut -d'/' -f1)
          echo "Pylint Score: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Run Format Agent if Score < 8.5
        if: ${{ steps.lint.outputs.score < 8.5 }}
        run: python3 ./format_agent.py

      - name: Test App Code
        run: python ./main_test.py